[project]
name = "ai-framework-sh"
version = "0.1.0"
description = "A self-hosted AI assistant framework (model runtime, RAG, agent loop, memory)."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "requests", # Model runtime: HTTPC calls to the Ollama server
    "chromadb", # Vector store
    #   "pypdf" # PDF ingestion
]

[tool.setuptools.packages.find]
include = ["framework*"]

[project.optional-dependencies]
dev = [
    "pytest",   # Day 14, tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
