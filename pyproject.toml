[project]
name = "ai-framework-sh"
version = "0.1.0"
description = "A self-hosted AI assistant framework (model runtime, RAG, agent loop, memory)."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # We'll add these as the plan introduces them:
    #   "ollama"     (Days 2-3, model runtime)
    "requests", # Days 2-3, HTTP Calls to Ollama)
    #   "chromadb"   (Days 4-6, vector store)
    #   "pypdf"      (Days 4-6, PDF ingest)
]

[project.optional-dependencies]
dev = [
    "pytest",   # Day 14, tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
